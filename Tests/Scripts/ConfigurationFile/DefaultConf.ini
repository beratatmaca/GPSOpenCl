[RawData]
# Signal file or FIFO path. A .fifo path enables the gps-sdr-sim streaming source.
DataSource = capture.dat
# Sampling rate in Hz. Must give a power-of-two samples per 1 ms code period.
SamplingFrequency = 4096000

[Acquisition]
# Doppler search window in Hz. Widen for high receiver dynamics.
AcquisitionMinimumDoppler = -4000
AcquisitionMaximumDoppler = 4000
# Doppler bin step in Hz. Smaller finds weaker signals but searches longer.
AcquisitionDopplerSearchRange = 500
# Minimum C/N0 in dB-Hz to declare a satellite acquired. Lower catches weaker satellites plus more false locks.
AcquisitionCn0Threshold = 43.0

[Tracking]
# Blocks between TrackingOutput telemetry publishes per channel. 10 means 100 Hz per channel.
TrackingTelemetryIntervalBlocks = 10

[PvtSolver]
# Saastamoinen troposphere correction. Keep 0 for simulated signals since gps-sdr-sim models no troposphere. Use 1 for real sky.
PvtTropoEnabled = 0

[Profiler]
# Per-stage timing telemetry. 0 removes all timing overhead from the hot path.
ProfilerEnabled = 1
